name = "globalnews-news-collector"
main = "worker/index.ts"
compatibility_date = "2026-09-19"

[triggers]
crons = ["*/30 * * * *"]

[[kv_namespaces]]
binding = "NEWS_KV"
id = "5cd9bc731aad4577ac3b58b5f9419ffc"

# Configure ADMIN_PASSWORD and ADMIN_SECRET as Cloudflare Worker secrets.
# Secret values are intentionally not stored in this repository.
